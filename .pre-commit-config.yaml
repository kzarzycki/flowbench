# Managed by Copier — edit the template, then `copier update`.
# Run locally: pre-commit run --all-files   ·   Update pins: pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg, pre-push, post-checkout]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # APM owns these trees and hash-tracks every deployed file. An autofix
      # here is invisible drift that fails `mise run agent-sync -- --frozen`,
      # so the rewriting hooks skip them. The secret scanners below still read
      # them — vendored third-party content is exactly what needs scanning.
      - id: end-of-file-fixer
        exclude: &apm_managed '^(\.agents|\.claude|\.codex|\.github/instructions)/|(^|/)AGENTS\.md$|/CLAUDE\.md$'
      - id: trailing-whitespace
        exclude: *apm_managed
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: '\.jsonc$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # apm.lock.yaml is resolved git SHAs and content hashes, which read as
      # high-entropy strings. It is generated, so it cannot carry an inline
      # allowlist pragma. gitleaks below still scans it.
      - id: detect-secrets
        exclude: '^apm\.lock\.yaml$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.27.0
    hooks:
      - id: zizmor

  # Reject staged symlinks whose target doesn't resolve.
  - repo: local
    hooks:
      - id: check-symlinks
        name: reject dangling symlinks
        entry: scripts/check-symlinks.sh
        language: script
        types: [symlink]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: ["--fix"]
        exclude: *apm_managed
      - id: ruff-format
        exclude: *apm_managed
  - repo: local
    hooks:
      - id: pytest
        name: pytest (pre-push)
        entry: uv run --extra dev --extra live pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: local
    hooks:
      - id: one-worktree-one-branch
        name: one worktree, one branch (post-checkout)
        entry: scripts/post-checkout.sh
        language: script
        stages: [post-checkout]
        always_run: true
        pass_filenames: false
