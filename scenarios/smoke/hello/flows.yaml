# The engine's own smoke gate, not a comparison: each flow is graded on its own by
# the case's `score` (see case.py) and there is no judge.md. One flow per harness
# the engine can drive, because a gate that only ever exercises claude-native
# cannot catch a regression in the other one.
flows:
  - name: claude
    harness: claude-native
    model: haiku            # the cheapest model that can still be asked to write a file
    skills: none            # bare Claude Code: nothing here is worth varying
  - name: agy
    harness: antigravity-native
    model: gemini-3.8-flash-low   # effort is part of the agy model id, not a separate field
    # No `skills:` and no `reasoning_effort:` on purpose. This harness honours
    # neither (docs/design/runner.md, "Where a flow's skills live at run time"),
    # and declaring a field the bridge drops is the one thing a flow must not do.
