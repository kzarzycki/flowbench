# One flow: this case is the engine's own smoke gate, not a comparison. What it
# proves is that a run happens at all, so the single flow is graded by the case's
# own `score` (see case.py) and there is no judge.md to compare against.
flows:
  - name: claude
    harness: claude-native
    model: haiku            # the cheapest model that can still be asked to write a file
    # [project] loads the workspace's own .claude/skills/ and nothing else: the
    # operator's ~/.claude stays hidden, so the skill below is the ONLY one the
    # flow has. "none" would be --setting-sources "", which loads neither.
    skills: [project]
    skill_dirs:             # seeded to <flow_dir>/.claude/skills/, where a project keeps them
      - skills/greeting-file
