[project]
name = "flowbench"
version = "0.0.1"
description = "A benchmark that compares agentic flows on a fixed case, all driven through omnigent as the meta-harness."
authors = [{ name = "Krzysztof Zarzycki", email = "k.zarzycki@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.15.22", "pytest-cov>=5", "diff-cover>=9"]
# the omnigent runtime for live runs: drive a real coding agent under omnigent.
# Optional + heavy (omnigent pulls ~64 deps, needs Node>=22, tmux):
#   uv sync --extra dev --extra live
live = [
  "omnigent-client==0.1.1",   # pinned (pre-1.0 churn)
  "omnigent==0.1.1",          # the driver imports omnigent.host at start(); same pin
]

[project.scripts]
flowbench = "flowbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowbench"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live_agent: drives a real coding agent via omnigent (RUN_LIVE_AGENT=1 + live extra); skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
